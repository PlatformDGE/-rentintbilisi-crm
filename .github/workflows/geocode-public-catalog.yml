name: Geocode public catalog

on:
  workflow_dispatch:
  push:
    paths:
      - "site/data/rent.json"
      - "site/data/sale.json"
      - "scripts/geocode_public_catalog.py"
      - ".github/workflows/geocode-public-catalog.yml"

permissions:
  contents: write

concurrency:
  group: geocode-public-catalog
  cancel-in-progress: false

jobs:
  geocode:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Geocode public catalog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/geocode_public_catalog.py
      - name: Commit coordinates
        run: |
          if git diff --quiet -- site/data/rent.json site/data/sale.json; then
            echo "No new coordinates"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/rent.json site/data/sale.json
          git commit -m "Geocode public catalog"
          git push
