name: Deploy public CRM and watermark test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p public
          cp index.html platform-90-10.html post-generator-modern.html crm-core.html app.js styles.css dashboard.css sw.js manifest.json manifest.webmanifest logo.png Logo_rent.png homes-in-georgia.jpg homes-in-georgia-splash.jpg homes-in-georgia-icon-192.png homes-in-georgia-icon-512.png telegram-top10.js telegram-top10.json public/
          cp -R site public/site
          # Version every site asset URL with the commit so browsers never mix
          # a cached old module with a new page after a deploy.
          V="${GITHUB_SHA::8}"
          find public/site/assets/js -name '*.js' -exec sed -i -E "s#(from '\.{1,2}/[^']+\.js)'#\1?v=$V'#g" {} +
          sed -i -E "s#(assets/(css|js)/[a-z-]+\.(css|js))\"#\1?v=$V\"#g" public/site/index.html
          cp watermark-test.html public/watermark-test.html
          cp -R watermark-test-assets public/watermark-test-assets
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
