name: Deploy public CRM and watermark test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p public
          cp index.html platform-90-10.html post-generator-modern.html crm-core.html app.js styles.css dashboard.css sw.js manifest.json manifest.webmanifest logo.png Logo_rent.png homes-in-georgia.jpg homes-in-georgia-splash.jpg telegram-top10.js telegram-top10.json public/
          cp -R site public/site
          cp watermark-test.html public/watermark-test.html
          cp -R watermark-test-assets public/watermark-test-assets
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
