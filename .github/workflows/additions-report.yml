name: Additions report (one-off)

on:
  push:
    branches: [claude/project-thread-5tmn4o]
    paths:
      - "scripts/additions_report.py"
      - ".github/workflows/additions-report.yml"
  workflow_dispatch:

permissions:
  contents: write

# Shares TELEGRAM_CRM_SESSION with the catalog and Top-10 jobs.
concurrency:
  group: telegram-crm-session
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect posts
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_CRM_SESSION }}
        run: python scripts/additions_report.py
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/additions.json
          git diff --cached --quiet || (git commit -m "Additions report" && git push)
