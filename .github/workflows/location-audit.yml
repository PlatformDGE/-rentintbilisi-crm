# Made with Claude (Anthropic) · © Homes in Georgia · Created by Irakli Kvirkvelia
# Read-only check of post map links. Runs only on its own branch, never on main,
# and writes its report to that branch. The site and catalog are not touched.
name: Location audit

on:
  push:
    branches: [site/location-audit]
    paths:
      - "scripts/audit_locations.py"
      - ".github/workflows/location-audit.yml"

permissions:
  contents: write

# Shares TELEGRAM_CRM_SESSION with the catalog updates, so they never overlap.
concurrency:
  group: telegram-crm-session
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            requirements.txt
            site/data
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check links
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_CRM_SESSION }}
        run: python scripts/audit_locations.py
      - name: Save report on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git sparse-checkout add audit
          git add audit/locations.json
          git commit -m "Location audit report"
          git push origin HEAD:site/location-audit
