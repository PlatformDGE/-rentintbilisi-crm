name: Update Homes in Georgia public catalog

on:
  schedule:
    - cron: "0 6-18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homes-public-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build active Rent and Sale catalogs
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python scripts/update_public_catalog.py
      - name: Publish catalog data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/media
          git diff --cached --quiet || (git commit -m "Update Homes in Georgia active catalog" && git push)
