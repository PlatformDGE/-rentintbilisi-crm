name: Update Telegram Top 10

on:
  schedule:
    - cron: "0 6-18 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Запустить временный тестовый режим и сразу показать текущие репосты"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Shares TELEGRAM_CRM_SESSION with update-public-catalog.yml. The common
# concurrency group keeps the two jobs from using the session at the same time,
# which Telegram can punish by revoking it (AUTH_KEY_DUPLICATED).
concurrency:
  group: telegram-crm-session
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Telegram secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_CRM_SESSION }}
        run: |
          missing=()
          test -n "$TELEGRAM_API_ID" || missing+=(TELEGRAM_API_ID)
          test -n "$TELEGRAM_API_HASH" || missing+=(TELEGRAM_API_HASH)
          test -n "$TELEGRAM_SESSION" || missing+=(TELEGRAM_CRM_SESSION)
          if (( ${#missing[@]} )); then
            echo "::error::Не заданы GitHub Secrets: ${missing[*]}. Создайте сессию через scripts/create_telegram_session.py (см. README)."
            exit 1
          fi
      - name: Update daily repost ranking
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_CRM_SESSION }}
          TELEGRAM_TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
        run: |
          for attempt in 1 2 3; do
            echo "Telegram sync attempt ${attempt}/3"
            if python scripts/update_telegram_top10.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - name: Commit updated data
        run: |
          if git diff --quiet -- telegram-top10.json telegram-reposts-state.json telegram-images; then
            echo "Telegram repost ranking has not changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram-top10.json telegram-reposts-state.json telegram-images
          git commit -m "Update daily Telegram repost ranking"
          git push
