name: Update Telegram Top 10

on:
  schedule:
    - cron: "0 6-18 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Запустить временный тестовый режим и сразу показать текущие репосты"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-telegram-repost-ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Telegram secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          missing=()
          test -n "$TELEGRAM_API_ID" || missing+=(TELEGRAM_API_ID)
          test -n "$TELEGRAM_API_HASH" || missing+=(TELEGRAM_API_HASH)
          test -n "$TELEGRAM_SESSION" || missing+=(TELEGRAM_SESSION)
          if (( ${#missing[@]} )); then
            echo "Missing required Telegram secrets:"
            printf '%s\n' "${missing[@]}"
            exit 1
          fi
      - name: Update daily repost ranking
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
        run: |
          for attempt in 1 2 3; do
            echo "Telegram sync attempt ${attempt}/3"
            if python scripts/update_telegram_top10.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- telegram-top10.json telegram-reposts-state.json telegram-images
          if git diff --cached --quiet -- telegram-top10.json telegram-reposts-state.json telegram-images; then
            echo "Telegram repost ranking has not changed"
            exit 0
          fi
          git commit -m "Update daily Telegram repost ranking"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after ${attempt} attempts" >&2
              exit 1
            fi
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then
              git rebase --abort || true
              exit 1
            fi
          done
