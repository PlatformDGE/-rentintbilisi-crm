<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>Аналитика · Homes in Georgia</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Georgian',sans-serif;
  --brand:#3390ec;--brand-strong:#3390ec;--brand-600:#3390ec;--brand-soft:#dfeefc;--brand-tint:#f5f6f7;
  --hig-red:#E3172D;--hig-red-soft:#FDE8EA;
  --ink:#3390ec;--ink-2:#3d4145;--muted:#5a6065;--faint:#979ca2;
  --line:#e8eaeb;--line-2:#dbdddf;--canvas:#f5f6f7;--surface:#FFFFFF;
  --ok:#0F7B55;--ok-soft:#E6F5EE;--warn:#B45309;--warn-soft:#FEF3E2;

  /* old tokens, re-pointed to the brand */
  --bg:var(--canvas);--bg2:var(--surface);--bg3:#e9f3fd;--bg4:#e8eaeb;
  --border:var(--line);--border2:var(--line-2);
  --text:var(--ink);--text2:var(--muted);--text3:var(--faint);
  --accent:var(--brand-600);--accent2:var(--brand-600);--glow:rgba(51,144,236,.10);
  --green:#0F7B55;--gbg:var(--ok-soft);
  --red:#C8102E;--rbg:var(--hig-red-soft);
  --amber:#B45309;--abg:var(--warn-soft);
  --blue:#3390ec;--bbg:#e7f2fd;
  --navy:var(--brand);
  --r:14px;--rsm:10px;--rlg:18px;
  --shadow-sm:0 1px 2px rgba(51,144,236,.06),0 1px 1px rgba(51,144,236,.04);
  --shadow:0 6px 24px rgba(51,144,236,.07),0 2px 6px rgba(51,144,236,.04);
  --shadow-lg:0 24px 60px rgba(51,144,236,.16),0 6px 18px rgba(51,144,236,.08);
  --ease:cubic-bezier(.2,.8,.2,1);
  --side-w:248px;--top-h:64px;
}
html,body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font)}
.screen{display:flex;flex-direction:column;min-height:100vh}
</style>
</head>
<body data-stats="key">
<div class="screen" id="tab-analytics"></div>
<script src="report.js"></script>
</body>
</html>
