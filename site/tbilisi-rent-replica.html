<script>
const state={mode:'rent',items:[],filters:{sort:'date',type:'all',rooms:'all',district:'all',min:'',max:''},detail:null,detailPhoto:0};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cfg={rent:{label:'Rent',channel:'rent_tbilisi_ge'},sale:{label:'Sale',channel:'sale_in_tbilisi'},commercial:{label:'Commercial',channel:''},cars:{label:'Cars',channel:'carsintbilisi'},development:{label:'Development',channel:''}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const price=v=>{const n=Number(v||0);return state.mode==='sale'&&n>0&&n<10000?n*1000:n};
const pretty=n=>Number(n||0).toLocaleString('en-US');
function activeItems(){let a=state.items.slice(),f=state.filters;a=a.filter(x=>!f.district||f.district==='all'||x.district===f.district);if(f.rooms&&f.rooms!=='all')a=a.filter(x=>f.rooms==='5+'?Number(x.rooms)>=5:String(x.rooms)===f.rooms);if(f.min)a=a.filter(x=>price(x.price)>=Number(f.min));if(f.max)a=a.filter(x=>price(x.price)<=Number(f.max));a.sort((x,y)=>f.sort==='priceUp'?price(x.price)-price(y.price):f.sort==='priceDown'?price(y.price)-price(x.price):new Date(y.published_at||0)-new Date(x.published_at||0));return a}
function load(){const c=cfg[state.mode];$('#mapSource').textContent=c.channel||'источник будет подключён';if(!c.channel){state.items=[];render();return}fetch('data/'+state.mode+'.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{state.items=Array.isArray(d.items)?d.items:[];render()}).catch(()=>{state.items=[];render()})}
function render(){const rows=activeItems();$('#listing').innerHTML=rows.length?rows.map(card).join(''):`<div class="empty"><b>${cfg[state.mode].label}</b><br>${cfg[state.mode].channel?'Актуальных объектов пока нет.':'Канал направления будет подключён отдельным модулем.'}</div>`;renderMarkers(rows);buildDistricts();const note=$('#mapNote');if(note){const exact=rows.filter(x=>Number.isFinite(Number(x.lat??x.latitude))&&Number.isFinite(Number(x.lon??x.lng??x.longitude))).length;note.dataset.coordinates=exact+'/'+rows.length;}}
function card(x){const photos=Array.isArray(x.photos)&&x.photos.length?x.photos:(x.image?[x.image]:[]),photo=photos[0]||'';return `<article class="card"><div class="card-media"><img src="${esc(photo)}" alt="${esc(x.title||'Объект')}" loading="lazy"><div class="watermark">HOMES IN GEORGIA</div><span class="photo-count">1 из ${photos.length||1}</span></div><div class="card-body"><div class="price-row"><span class="price">${pretty(price(x.price))}</span><span class="unit">$${state.mode==='rent'?'/мес.':''}</span></div><div class="facts"><div class="fact"><b>${esc(x.rooms||'—')}-комн.</b><span>Квартира</span></div><div class="fact"><b>${esc(x.area||'—')} м²</b><span>Площадь</span></div><div class="fact"><b>${esc(x.floor||'—')}</b><span>Этаж</span></div></div><div class="address"><i>⌖</i><span>${esc(x.title||x.district||'Грузия')}</span></div><div class="metro">◉ ${esc(x.metro||x.district||'Грузия')}</div><div class="card-actions"><button class="primary" onclick="openDetail('${esc(x.id)}')">Подробнее</button><button type="button">♡</button><button type="button" onclick="navigator.clipboard?.writeText('${esc(x.post_url||'')}')">↗</button><button type="button">⌖</button></div></div></article>`}
const districtGeo={Vake:[41.7065,44.7676],Saburtalo:[41.7278,44.7502],Vera:[41.7078,44.7901],Chugureti:[41.7118,44.8014],Isani:[41.6878,44.8357],Digomi:[41.7658,44.7421],Nadzaladevi:[41.7354,44.7787],Didube:[41.7398,44.7822],Temirlik:[41.695,44.84]};
function markerPosition(x,i){const raw=String(x.map_url||x.maps_url||x.location_url||'');const hit=raw.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||raw.match(/[?&](?:q|query)=(-?\d+\.\d+),(-?\d+\.\d+)/);const lat=Number(x.lat??x.latitude??(hit&&hit[1])),lon=Number(x.lon??x.lng??x.longitude??(hit&&hit[2]));let p=Number.isFinite(lat)&&Number.isFinite(lon)?[lat,lon]:(districtGeo[x.district]||[41.7151,44.8271]);const jitter=Number.isFinite(lat)&&Number.isFinite(lon)?0:((i%5)-2)*.0012;const left=Math.max(5,Math.min(95,((p[1]+jitter)-44.70)/.22*100));const top=Math.max(12,Math.min(84,(41.82-(p[0]+jitter))/.20*100));return [left,top]}
function renderMarkers(rows){$('#markers').innerHTML=rows.map((x,i)=>{const [left,top]=markerPosition(x,i),kind=state.mode+'-pin',icon={rent:'⌂',sale:'✦',commercial:'▦',cars:'▱',development:'◆'}[state.mode]||'⌂',prefix=state.mode==='rent'?'от ':'';return `<button class="pin ${kind}" style="left:${left}%;top:${top}%" aria-label="${esc(x.title||'Объект')}" onclick="openDetail('${esc(x.id)}')"><span class="pin-icon">${icon}</span><b class="pin-price">${prefix}${pretty(price(x.price))} $</b><span class="pin-index">${i+1}</span></button>`}).join('')}
function buildDistricts(){const wrap=$('#districtChips'),vals=[...new Set(state.items.map(x=>x.district).filter(Boolean))].sort();wrap.innerHTML='<button class="chip active" data-value="all">Все районы</button>'+vals.map(v=>`<button class="chip" data-value="${esc(v)}">${esc(v)}</button>`).join('');wrap.querySelectorAll('button').forEach(b=>b.onclick=()=>{wrap.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filters.district=b.dataset.value})}
function openFilters(){$('#filterSheet').classList.add('open')}function closeFilters(){$('#filterSheet').classList.remove('open')}
function openDetail(id){const x=state.items.find(a=>String(a.id)===String(id));if(!x)return;state.detail=x;state.detailPhoto=0;updateDetail();$('#detailSheet').classList.add('open')}
function updateDetail(){const x=state.detail,p=Array.isArray(x.photos)&&x.photos.length?x.photos:(x.image?[x.image]:[]);$('#detailImage').src=p[state.detailPhoto]||'';$('#detailCount').textContent=`${state.detailPhoto+1} из ${p.length||1}`;$('#detailPrice').textContent=`${pretty(price(x.price))} $${state.mode==='rent'?'/мес.':''}`;$('#detailFacts').innerHTML=`<div class="fact"><b>${esc(x.rooms||'—')}-комн.</b><span>Квартира</span></div><div class="fact"><b>${esc(x.area||'—')} м²</b><span>Площадь</span></div><div class="fact"><b>${esc(x.floor||'—')}</b><span>Этаж</span></div>`;$('#detailAddress').innerHTML=`<i>⌖</i><span>${esc(x.title||x.district||'Грузия')}</span>`;$('#detailMetro').textContent='◉ '+(x.metro||x.district||'Грузия');$('#detailDescription').textContent=x.description||'Актуальное объявление из подключённого Telegram-канала. Доступность уточняется у менеджера.'}
function setMode(mode){state.mode=mode;state.items=[];state.filters={sort:'date',type:'all',rooms:'all',district:'all',min:'',max:''};$$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));load()}
$$('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$$('.bottomnav button').forEach(b=>b.onclick=()=>{$$('.bottomnav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.view').forEach(v=>v.classList.remove('active'));$('#'+b.dataset.view).classList.add('active');if(b.dataset.view==='listView')render()});$('#mapFilter').onclick=openFilters;$('#listFilter').onclick=openFilters;$('#closeFilters').onclick=closeFilters;$('#detailBack').onclick=()=>$('#detailSheet').classList.remove('open');$('#detailNext').onclick=()=>{const p=state.detail?.photos||[];if(p.length){state.detailPhoto=(state.detailPhoto+1)%p.length;updateDetail()}};$('#applyFilters').onclick=()=>{state.filters.min=$('#minPrice').value;state.filters.max=$('#maxPrice').value;closeFilters();render()};$('#resetFilters').onclick=()=>{state.filters={sort:'date',type:'all',rooms:'all',district:'all',min:'',max:''};$('#minPrice').value='';$('#maxPrice').value='';$$('.chip').forEach((b,i)=>b.classList.toggle('active',i===0));render()};$$('[data-filter]').forEach(group=>group.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{group.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filters[group.dataset.filter]=b.dataset.value}));load();
</script>
<script>
(() => {
  const mapSurface=document.querySelector('.map-surface');
  if(mapSurface){mapSurface.outerHTML='<iframe class="google-map" title="Карта объектов Homes in Georgia" loading="lazy" src="https://www.google.com/maps?q=Tbilisi%2C%20Georgia&output=embed&z=12"></iframe><div class="map-glass"></div><a class="map-open" href="https://www.google.com/maps/@41.7151,44.8271,12z" target="_blank" rel="noopener">Открыть Google Maps ↗</a>';}
  const zoom=document.querySelector('.zoom');
  if(zoom&&!zoom.querySelector('.measure')){const b=document.createElement('button');b.className='measure';b.type='button';b.textContent='⌁';b.setAttribute('aria-label','Измерить расстояние');zoom.appendChild(b);}
  const wrap=document.querySelector('.map-wrap');

      <div class="section-title">Строение</div>
      <div class="chips" data-filter="construction"><button class="chip active" data-value="all">Все</button><button class="chip" data-value="new">Новостройка</button><button class="chip" data-value="old">Старый фонд</button></div>
      <div class="section-title">Состояние</div>

      <div class="channel-filter-note">Фильтры повторяют поля публикаций Telegram. Если поле ещё не заполнено в источнике, объект остаётся видимым до обогащения данных.</div>`);
  }
  const detailCta=document.querySelector('#detailSheet .detail-cta .primary');
  if(detailCta){detailCta.textContent='Спросите о квартире';detailCta.setAttribute('aria-label','Спросите о квартире');detailCta.onclick=()=>alert('Запрос отправлен менеджеру Homes in Georgia');}
  const filterDefaults={sort:'date',type:'all',propertyType:'all',complex:'all',rooms:'all',bedrooms:'all',construction:'all',condition:'all',district:'all',min:'',max:''};
  function matchesField(item,key,value){if(!value||value==='all')return true;const candidates=[item[key],item[key+'_type'],item.property_type,item.object_type,item.building,item.building_type,item.condition,item.renovation,item.complex,item.residential_complex,item.is_complex];if(key==='complex')return value==='complex'?candidates.some(v=>v===true||String(v||'').toLowerCase().includes('жк')||String(v||'').toLowerCase().includes('complex')):true;if(key==='bedrooms')return value==='5+'?Number(item.bedrooms)>=5:String(item.bedrooms||'')===value;if(key==='propertyType')return candidates.some(v=>String(v||'').toLowerCase().includes(value==='apartment'?'кварт':value));if(key==='construction')return candidates.some(v=>String(v||'').toLowerCase().includes(value==='new'?'нов':'стар'));if(key==='condition')return candidates.some(v=>String(v||'').toLowerCase().includes(value));return true}
  window.activeItems=function(){let a=state.items.slice(),f=state.filters||{};a=a.filter(x=>!f.district||f.district==='all'||x.district===f.district);['propertyType','complex','bedrooms','construction','condition'].forEach(k=>{a=a.filter(x=>matchesField(x,k,f[k]))});if(f.rooms&&f.rooms!=='all')a=a.filter(x=>f.rooms==='5+'?Number(x.rooms)>=5:String(x.rooms)===f.rooms);if(f.min)a=a.filter(x=>price(x.price)>=Number(f.min));if(f.max)a=a.filter(x=>price(x.price)<=Number(f.max));a.sort((x,y)=>f.sort==='priceUp'?price(x.price)-price(y.price):f.sort==='priceDown'?price(y.price)-price(x.price):new Date(y.published_at||0)-new Date(x.published_at||0));return a};
  function setFilterHandlers(){document.querySelectorAll('#filterSheet [data-filter] .chip').forEach(button=>{button.onclick=()=>{const group=button.closest('[data-filter]');group.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));button.classList.add('active');state.filters[group.dataset.filter]=button.dataset.value;}})}
  setFilterHandlers();
  const measureButton=document.querySelector('.zoom .measure'),layer=document.getElementById('measureLayer');
  if(measureButton&&layer){let points=[];measureButton.onclick=()=>{points=[];layer.innerHTML='';layer.classList.toggle('active');measureButton.classList.toggle('active');if(layer.classList.contains('active')){if(note)note.textContent='Режим измерения: выберите две точки на карте';}else if(note)note.innerHTML='<span class="glass-caption">⌁ Карта Google · актуальные объекты · <b id="mapSource">'+(cfg[state.mode]?.channel||'источник')+'</b></span>'};layer.onclick=e=>{if(!layer.classList.contains('active'))return;const r=layer.getBoundingClientRect();points.push({x:e.clientX-r.left,y:e.clientY-r.top});const p=points[points.length-1],dot=document.createElement('i');dot.className='measure-point';dot.style.left=p.x+'px';dot.style.top=p.y+'px';layer.appendChild(dot);if(points.length===2){const a=points[0],b=points[1],dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy),line=document.createElement('i');line.className='measure-line';line.style.left=a.x+'px';line.style.top=a.y+'px';line.style.width=d+'px';line.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';layer.appendChild(line);const label=document.createElement('b');label.className='measure-label';label.style.left=((a.x+b.x)/2)+'px';label.style.top=((a.y+b.y)/2-16)+'px';label.textContent=(d/52).toFixed(2)+' км · приблизительно';layer.appendChild(label);if(note)note.textContent='Расстояние показано приблизительно по масштабу карты. Нажмите ⌁ для нового измерения';layer.classList.remove('active');measureButton.classList.remove('active');}}}
  const oldApply=document.getElementById('applyFilters');if(oldApply)oldApply.onclick=()=>{state.filters.min=document.getElementById('minPrice').value;state.filters.max=document.getElementById('maxPrice').value;closeFilters();render()};
  const oldReset=document.getElementById('resetFilters');if(oldReset)oldReset.onclick=()=>{state.filters={...filterDefaults};document.getElementById('minPrice').value='';document.getElementById('maxPrice').value='';document.querySelectorAll('#filterSheet .chip').forEach((b,i)=>b.classList.toggle('active',i===0));render()};
