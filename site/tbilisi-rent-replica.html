function objectMapUrl(x){if(x.map_url)return x.map_url;const query=[x.title,x.district,'Tbilisi, Georgia'].filter(Boolean).join(', ');return query?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query):''}
function load(){const c=cfg[state.mode];$('#mapSource').textContent=state.mode==='all'?'rent_tbilisi_ge + sale_in_tbilisi':(c.channel||'source will be connected');const fetchRows=mode=>fetch('data/'+mode+'.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(d=>(Array.isArray(d.items)?d.items:[]).map(x=>({...x,map_url:objectMapUrl(x),_mode:mode})));if(state.mode==='all'){Promise.all([fetchRows('rent'),fetchRows('sale')]).then(([rentRows,saleRows])=>{const saleNormalized=saleRows.map(x=>({...x,price:Number(x.price)>0&&Number(x.price)<10000?Number(x.price)*1000:x.price}));state.items=[...rentRows,...saleNormalized];render();setTimeout(()=>{ensureRealMap();renderMarkers(activeItems())},250)}).catch(()=>{state.items=[];render()});return}if(!c.channel){state.items=[];render();return}fetchRows(state.mode).then(rows=>{state.items=rows;render();setTimeout(()=>{ensureRealMap();renderMarkers(activeItems())},250)}).catch(()=>{state.items=[];render()})}

function ensureRealMap(){if(hgMap||!window.L||!document.getElementById('leafletMap'))return;hgMap=L.map('leafletMap',{zoomControl:true,attributionControl:true}).setView([41.7151,44.8271],12);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap contributors © CARTO'}).addTo(hgMap);hgLayer=L.layerGroup().addTo(hgMap)}

function buildDistricts(){const wrap=$('#districtChips');if(!wrap)return;const districts=window.TBILISI_DISTRICTS||[];wrap.innerHTML='<button class="chip active" data-value="all">All districts</button>'+districts.map(v=>`<button class="chip" data-value="${esc(v)}">${esc(v)}</button>`).join('');wrap.querySelectorAll('button').forEach(b=>b.onclick=()=>{wrap.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filters.district=b.dataset.value})}

  if(detailCta){detailCta.textContent='Ask about this listing';detailCta.setAttribute('aria-label','Ask about this listing');detailCta.onclick=()=>alert('Request sent to Homes in Georgia manager');}
  const filterDefaults={sort:'date',type:'all',priceBand:'all',propertyType:'all',complex:'all',rooms:'all',bedrooms:'all',construction:'all',condition:'all',district:'all',metro:'all',min:'',max:''};
  function matchesField(item,key,value){if(!value||value==='all')return true;const candidates=[item[key],item[key+'_type'],item.property_type,item.object_type,item.building,item.building_type,item.condition,item.renovation,item.complex,item.residential_complex,item.is_complex].map(v=>String(v??'').toLowerCase());if(key==='complex')return value==='complex'?candidates.some(v=>v==='true'||v==='1'||v.includes('жк')||v.includes('complex')||v.includes('residential')):true;if(key==='bedrooms')return value==='5+'?Number(item.bedrooms)>=5:String(item.bedrooms||'')===value;if(key==='propertyType'){const aliases={apartment:['apartment','кварт'],house:['house','дом','котт'],commercial:['commercial','коммер','retail','business']};return candidates.some(v=>(aliases[value]||[value]).some(alias=>v.includes(alias)))}if(key==='construction')return candidates.some(v=>value==='new'?v.includes('new')||v.includes('нов'):v.includes('old')||v.includes('стар'));if(key==='condition'){const aliases={new:['new','renov','fully'],old:['old','retro','under'],black:['black'],white:['white'],green:['green']};return candidates.some(v=>(aliases[value]||[value]).some(alias=>v.includes(alias)))}return true}
  window.activeItems=function(){let a=state.items.slice(),f=state.filters||{};a=a.filter(x=>!f.district||f.district==='all'||String(x.district||'').toLowerCase()===String(f.district).toLowerCase());a=a.filter(x=>!f.metro||f.metro==='all'||String(x.metro||'').toLowerCase()===String(f.metro).toLowerCase());if(f.priceBand&&f.priceBand!=='all')a=a.filter(x=>{const n=price(x.price);return f.priceBand==='low'?n<=400:f.priceBand==='mid'?n>=400&&n<=600:f.priceBand==='high'?n>=700:true});['propertyType','complex','bedrooms','construction','condition'].forEach(k=>{a=a.filter(x=>matchesField(x,k,f[k]))});if(f.rooms&&f.rooms!=='all')a=a.filter(x=>f.rooms==='5+'?Number(x.rooms)>=5:String(x.rooms)===f.rooms);if(f.min)a=a.filter(x=>price(x.price)>=Number(f.min));if(f.max)a=a.filter(x=>price(x.price)<=Number(f.max));a.sort((x,y)=>f.sort==='priceUp'?price(x.price)-price(y.price):f.sort==='priceDown'?price(y.price)-price(x.price):new Date(y.published_at||0)-new Date(x.published_at||0));return a};
  function setFilterHandlers(){document.querySelectorAll('#filterSheet [data-filter] .chip').forEach(button=>{button.onclick=()=>{const group=button.closest('[data-filter]');group.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));button.classList.add('active');const key=group.dataset.filter,value=button.dataset.value;if(key==='type'&&value!=='all'){setMode(value);closeFilters();return}state.filters[key]=value;}})}
  setFilterHandlers();
  const measureButton=document.querySelector('.zoom .measure'),layer=document.getElementById('measureLayer');
  if(measureButton&&layer){let points=[];measureButton.onclick=()=>{points=[];layer.innerHTML='';layer.classList.toggle('active');measureButton.classList.toggle('active');if(layer.classList.contains('active')){if(note)note.textContent='Measure mode: select two points on the map';}else if(note)note.innerHTML='<span class="glass-caption">⌁ Interactive map · live listings · <b id="mapSource">'+(cfg[state.mode]?.channel||'source')+'</b></span>'};layer.onclick=e=>{if(!layer.classList.contains('active'))return;const r=layer.getBoundingClientRect();points.push({x:e.clientX-r.left,y:e.clientY-r.top});const p=points[points.length-1],dot=document.createElement('i');dot.className='measure-point';dot.style.left=p.x+'px';dot.style.top=p.y+'px';layer.appendChild(dot);if(points.length===2){const a=points[0],b=points[1],dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy),line=document.createElement('i');line.className='measure-line';line.style.left=a.x+'px';line.style.top=a.y+'px';line.style.width=d+'px';line.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';layer.appendChild(line);const label=document.createElement('b');label.className='measure-label';label.style.left=((a.x+b.x)/2)+'px';label.style.top=((a.y+b.y)/2-16)+'px';label.textContent=(d/52).toFixed(2)+' km · approximate';layer.appendChild(label);if(note)note.textContent='Distance shown approximately. Press ⌁ to measure again';layer.classList.remove('active');measureButton.classList.remove('active');}}}
  const oldApply=document.getElementById('applyFilters');if(oldApply)oldApply.onclick=()=>{state.filters.min=document.getElementById('minPrice').value;state.filters.max=document.getElementById('maxPrice').value;closeFilters();render()};
  const oldReset=document.getElementById('resetFilters');if(oldReset)oldReset.onclick=()=>{state.filters={...filterDefaults};document.getElementById('minPrice').value='';document.getElementById('maxPrice').value='';document.querySelectorAll('#filterSheet .chip').forEach((b,i)=>b.classList.toggle('active',i===0));render()};
})();
</script>
