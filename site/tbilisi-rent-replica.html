  <style>

    *{box-sizing:border-box}html,body{margin:0;background:#0b1020;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh;display:flex;justify-content:center}.phone{width:100%;max-width:540px;min-height:100vh;background:#f4f5f8;box-shadow:0 0 60px rgba(0,0,0,.35);position:relative;overflow:hidden}.topbar{height:92px;padding:17px 18px 11px;display:flex;align-items:end;justify-content:space-between;background:#f9fafc;position:sticky;top:0;z-index:20;border-bottom:1px solid #e9ebf0}.topbar .close{font-size:17px;border:0;background:transparent;color:#151b26;padding:6px 0}.brand{display:flex;align-items:center;gap:10px;line-height:1}.brand img{width:35px;height:35px;border-radius:10px;object-fit:cover}.brand strong{font-size:17px;letter-spacing:-.03em}.brand small{display:block;color:#8993a3;font-size:10px;margin-top:4px;text-align:center}.more{width:34px;height:34px;border:1px solid #d5d9e1;border-radius:50%;background:#fff;font-size:18px;color:#4a5362}.content{padding-bottom:84px}.view{display:none}.view.active{display:block}.map-wrap{height:calc(100vh - 177px);min-height:560px;position:relative;overflow:hidden;background:#233c4c}.map-surface{position:absolute;inset:0;background:radial-gradient(ellipse at 35% 40%,rgba(68,121,110,.6),transparent 35%),radial-gradient(ellipse at 76% 60%,rgba(39,86,87,.8),transparent 44%),linear-gradient(145deg,#203849,#172c40 55%,#1b3240)}.map-surface:before,.map-surface:after{content:"";position:absolute;inset:-15%;opacity:.5;background:repeating-linear-gradient(26deg,transparent 0 54px,rgba(159,194,191,.28) 55px 57px,transparent 58px 110px);transform:rotate(-12deg)}.map-surface:after{transform:rotate(54deg);opacity:.28}.map-label{position:absolute;color:rgba(230,240,239,.56);font-size:13px;font-weight:600;letter-spacing:.02em}.map-label.one{left:11%;top:26%}.map-label.two{left:52%;top:43%}.map-label.three{left:22%;top:67%}.map-label.four{right:4%;top:16%}.map-controls{position:absolute;top:17px;left:14px;right:14px;display:flex;align-items:center;gap:10px;z-index:2}.logo-mark{width:64px;height:64px;display:grid;place-items:center;background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.logo-mark img{width:53px;height:53px;object-fit:cover}.switch{display:flex;flex:1;background:#fff;border-radius:16px;padding:4px;box-shadow:var(--shadow)}.switch button{flex:1;border:0;border-radius:12px;background:transparent;padding:11px 8px;font-size:17px;color:#828c9e}.switch button.active{background:var(--red);color:#fff}.filter-btn{width:55px;height:55px;border:0;border-radius:17px;background:#fff;box-shadow:var(--shadow);font-size:24px;color:#79879b}.zoom{position:absolute;right:12px;top:98px;z-index:2;display:grid;background:#fff;border-radius:13px;box-shadow:var(--shadow);overflow:hidden}.zoom button{width:45px;height:45px;border:0;background:#fff;font-size:23px;color:#394456}.zoom button+button{border-top:1px solid #edf0f4}.markers{position:absolute;inset:0;z-index:1}.pin{position:absolute;border:0;border-radius:999px;background:var(--red);color:#fff;padding:8px 10px;font-weight:700;font-size:13px;box-shadow:0 5px 15px rgba(0,0,0,.28);white-space:nowrap;transform:translate(-50%,-50%);cursor:pointer}.pin span{background:#fff;color:var(--red);border-radius:50%;padding:2px 6px;margin-left:4px}.map-note{position:absolute;bottom:20px;left:14px;right:14px;padding:9px 12px;border-radius:12px;background:rgba(6,18,30,.72);color:#d7e0e7;font-size:11px;z-index:2;text-align:center}.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);height:84px;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.96);border-top:1px solid #e5e8ee;z-index:30;padding-bottom:env(safe-area-inset-bottom)}.bottomnav button{border:0;background:transparent;color:#8994a6;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.bottomnav button.active{color:var(--red)}.bottomnav .ico{font-size:23px;line-height:1}.toolbar{padding:14px 15px 12px;display:flex;gap:10px;align-items:center;background:#f5f6f9}.toolbar .logo-mini{width:48px;height:48px;border-radius:15px;object-fit:cover;background:#fff;padding:4px}.toolbar .filter-btn{width:48px;height:48px;box-shadow:none;border:1px solid var(--line)}.listing{background:#f5f6f9;padding:0 14px}..card{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 3px 14px rgba(20,32,50,.1);margin-bottom:16px}.card-media{height:260px;position:relative;background:#dfe3ea}.card-media img{width:100%;height:100%;display:block;object-fit:cover}.watermark{position:absolute;inset:0;display:grid;place-items:center;color:rgba(223,18,61,.48);font-size:40px;font-weight:800;letter-spacing:-.07em;transform:rotate(-18deg);pointer-events:none}.photo-count{position:absolute;right:12px;bottom:11px;background:rgba(0,0,0,.6);color:#fff;padding:5px 8px;border-radius:9px;font-size:12px}..card-body{padding:14px 16px 16px}.price-row{display:flex;align-items:baseline;gap:7px}.price{font-size:31px;font-weight:800;letter-spacing:-.05em}.unit{font-size:16px}.old{font-size:13px;color:#8992a1;text-decoration:line-through}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.fact b{display:block;font-size:17px;font-weight:500}.fact span{display:block;color:#8c96a5;font-size:12px;margin-top:3px}.address{font-size:15px;display:flex;gap:8px;align-items:start;margin:9px 0;color:#202a37}.address i{color:var(--red);font-style:normal}.metro{font-size:13px;color:#687489;margin:7px 0}.card-actions{display:grid;grid-template-columns:1fr 48px 48px 48px;gap:8px;margin-top:13px}.card-actions button{border:0;border-radius:14px;min-height:45px;background:#eef1f6;color:#7b879c;font-size:21px}.card-actions .primary{background:var(--red);color:#fff;font-size:15px;font-weight:700}.loading,.empty{padding:30px 15px;text-align:center;color:#7b8798}.sheet{position:fixed;inset:0;z-index:50;display:none;align-items:end;background:rgba(10,17,28,.45)}.sheet.open{display:flex}.sheet-panel{width:min(540px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sheet-head h2{margin:0;font-size:21px}.sheet-head button{border:0;background:#f0f2f6;border-radius:50%;width:36px;height:36px;font-size:22px;color:#7c8797}.section-title{font-size:16px;font-weight:700;margin:18px 0 9px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #dce0e6;background:#f6f7f9;border-radius:11px;padding:10px 12px;font-size:14px;color:#2e3949}.chip.active{background:#1f2530;color:#fff;border-color:#1f2530}.range{display:grid;grid-template-columns:1fr 1fr;gap:10px}.range input{width:100%;padding:13px;border:1px solid #dce0e6;border-radius:12px;font-size:16px}.apply{width:100%;margin-top:21px;border:0;border-radius:14px;background:var(--red);color:#fff;padding:15px;font-size:16px;font-weight:700}.detail-panel{padding:0 0 calc(22px + env(safe-area-inset-bottom));max-height:94vh}.detail-hero{height:310px;position:relative;background:#dfe3ea}.detail-hero img{width:100%;height:100%;object-fit:cover}.detail-tools{position:absolute;inset:14px 14px auto;display:flex;justify-content:space-between}.round{width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.9);font-size:20px;color:#69778b}.detail-body{padding:18px}.detail-body h2{margin:0 0 8px;font-size:30px}.detail-body p{font-size:16px;line-height:1.45;color:#6d788a}.detail-cta{display:flex;gap:10px;padding:0 18px}.detail-cta button{border:0;border-radius:14px;padding:15px;background:#eff2f6;color:#56647a;font-size:18px}.detail-cta .primary{flex:1;background:var(--red);color:#fff;font-size:16px;font-weight:700}.more-view{padding:18px 15px}.more-hero{padding:21px;border-radius:24px;background:linear-gradient(135deg,#112e53,#193e71);color:#fff}.more-hero img{width:72px;height:72px;border-radius:22px;object-fit:cover;background:#fff;padding:6px}.more-hero h2{margin:18px 0 4px;font-size:25px}.more-hero p{margin:0;color:#b8c7dd}.menu{margin-top:16px;display:grid;gap:10px}.menu button{border:0;border-radius:18px;background:#fff;text-align:left;padding:17px;font-size:16px;color:#1b2636;box-shadow:0 3px 12px rgba(20,32,50,.07)}.menu button span{float:right;color:var(--red)}
    @media(max-width:380px){.topbar{height:84px}.map-wrap{min-height:530px}.card-media{height:228px}.price{font-size:28px}.facts{gap:4px}.fact b{font-size:15px}}
  </style>
</head>
<body>
  <div class="phone">
    <header class="topbar"><button class="close" type="button" onclick="history.back()">Закрыть</button><div class="brand"><img src="../Logo_rent.png" alt="Homes in Georgia"><div><strong>Homes in Georgia 🇬🇪</strong><small>CRM · каталог объектов</small></div></div><button class="more" type="button" aria-label="Меню">•••</button></header>
    <main class="content">
      <section id="mapView" class="view active"><div class="map-wrap"><div class="map-surface"></div><div class="map-label one">САБУРТАЛО</div><div class="map-label two">ВАКЕ</div><div class="map-label three">ДИДУБЕ</div><div class="map-label four">ТЕМИРЛИКИ</div><div class="markers" id="markers"></div><div class="map-controls"><div class="logo-mark"><img src="../Logo_rent.png" alt=""></div><div class="switch"><button class="active" data-mode="rent">Аренда</button><button data-mode="sale">Покупка</button></div><button class="filter-btn" id="mapFilter" type="button" aria-label="Открыть фильтры">☷</button></div><div class="zoom"><button type="button">＋</button><button type="button">−</button><button type="button">3D</button></div><div class="map-note" id="mapNote">Загрузка актуальных объектов из Telegram · <span id="mapSource">rent_tbilisi_ge</span></div></div></section>
      <section id="listView" class="view"><div class="toolbar"><img class="logo-mini" src="../Logo_rent.png" alt=""><div class="switch"><button class="active" data-mode="rent">Аренда</button><button data-mode="sale">Покупка</button></div><button class="filter-btn" id="listFilter" type="button" aria-label="Открыть фильтры">☷</button></div><div class="listing" id="listing"><div class="loading">Загружаем актуальные объекты…</div></div></section>
      <section id="moreView" class="view more-view"><div class="more-hero"><img src="../homes-in-georgia.jpg" alt="Homes in Georgia"><h2>Homes in Georgia</h2><p>Rent · Sale · Cars · Commercial · Development</p></div><div class="menu"><button type="button" onclick="alert('Раздел CRM подключается к профилю агента')">Личный кабинет <span>›</span></button><button type="button" onclick="alert('Контакт менеджера будет взят из CRM')">Связаться с менеджером <span>›</span></button><button type="button" onclick="alert('Избранное будет общим с CRM')">Избранные объекты <span>›</span></button><button type="button" onclick="alert('Синхронизация запускается GitHub Actions')">Статус синхронизации <span>›</span></button></div></section>
    </main>
    <nav class="bottomnav"><button class="active" data-view="mapView"><span class="ico">⌖</span>Карта</button><button data-view="listView"><span class="ico">▤</span>Объявления</button><button data-view="moreView"><span class="ico">•••</span>Больше</button></nav>
  </div>
  <div class="sheet" id="filterSheet"><div class="sheet-panel"><div class="sheet-head"><button id="resetFilters" type="button">Сбросить</button><h2>Фильтры</h2><button id="closeFilters" type="button">×</button></div><div class="section-title">Сортировка</div><div class="chips" data-filter="sort"><button class="chip active" data-value="date">Недавние</button><button class="chip" data-value="priceUp">Недорогие</button><button class="chip" data-value="priceDown">Дорогие</button></div><div class="section-title">Вид недвижимости</div><div class="chips" data-filter="type"><button class="chip active" data-value="all">Квартира</button><button class="chip" data-value="house">Дом</button><button class="chip" data-value="commercial">Коммерция</button></div><div class="section-title">Количество комнат</div><div class="chips" data-filter="rooms"><button class="chip active" data-value="all">Все</button><button class="chip" data-value="1">1</button><button class="chip" data-value="2">2</button><button class="chip" data-value="3">3</button><button class="chip" data-value="4">4</button><button class="chip" data-value="5">5+</button></div><div class="section-title">Цена</div><div class="range"><input id="minPrice" type="number" placeholder="От"><input id="maxPrice" type="number" placeholder="До"></div><div class="section-title">Район</div><div class="chips" id="districtChips"></div><button class="apply" id="applyFilters" type="button">Применить</button></div></div>
  <div class="sheet" id="detailSheet"><div class="sheet-panel detail-panel"><div class="detail-hero"><img id="detailImage" alt=""><div class="detail-tools"><button class="round" id="detailBack">×</button><button class="round" id="detailNext">›</button></div><div class="photo-count" id="detailCount"></div></div><div class="detail-body"><h2 id="detailPrice"></h2><div class="facts" id="detailFacts"></div><div class="address" id="detailAddress"></div><div class="metro" id="detailMetro"></div><p id="detailDescription"></p></div><div class="detail-cta"><button type="button">♡</button><button type="button">↗</button><button class="primary" type="button" onclick="alert('Контакт будет передан менеджеру CRM')">Написать менеджеру</button></div></div></div>
  <script>
  const state={mode:'rent',items:[],filters:{sort:'date',type:'all',rooms:'all',district:'all',min:'',max:''},detail:null,detailPhoto:0};
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const price=v=>{const n=Number(v||0);return state.mode==='sale'&&n>0&&n<10000?n*1000:n};
  const pretty=n=>Number(n||0).toLocaleString('en-US');
  function activeItems(){let a=state.items.slice();const f=state.filters;const q=f.district;a=a.filter(x=>!q||q==='all'||x.district===q);if(f.rooms&&f.rooms!=='all')a=a.filter(x=>f.rooms==='5+'?Number(x.rooms)>=5:String(x.rooms)===f.rooms);if(f.min)a=a.filter(x=>price(x.price)>=Number(f.min));if(f.max)a=a.filter(x=>price(x.price)<=Number(f.max));a.sort((x,y)=>f.sort==='priceUp'?price(x.price)-price(y.price):f.sort==='priceDown'?price(y.price)-price(x.price):new Date(y.published_at||0)-new Date(x.published_at||0));return a}
  function load(){fetch('data/'+state.mode+'.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{state.items=Array.isArray(d.items)?d.items:[];$('#mapSource').textContent=d.channel||state.mode+'_channel';render()}).catch(()=>{state.items=[];render()})}
  function render(){const rows=activeItems();$('#listing').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">По выбранным фильтрам объектов нет.</div>';renderMarkers(rows);buildDistricts();}
  function card(x,i){const photos=Array.isArray(x.photos)&&x.photos.length?x.photos:(x.image?[x.image]:[]),photo=photos[0]||'';return `<article class="card" data-id="${esc(x.id)}"><div class="card-media"><img src="${esc(photo)}" alt="${esc(x.title||'Объект')}" loading="lazy"><div class="watermark">HOMES</div><span class="photo-count">1 из ${photos.length||1}</span></div><div class="card-body"><div class="price-row"><span class="price">${pretty(price(x.price))}</span><span class="unit">$${state.mode==='rent'?'/мес.':''}</span></div><div class="facts"><div class="fact"><b>${esc(x.rooms||'—')}-комн.</b><span>Квартира</span></div><div class="fact"><b>${esc(x.area||'—')} м²</b><span>Площадь</span></div><div class="fact"><b>${esc(x.floor||'—')}</b><span>Этаж</span></div></div><div class="address"><i>⌖</i><span>${esc(x.title||x.district||'Тбилиси')}</span></div><div class="metro">◉ ${esc(x.metro||x.district||'Тбилиси')}</div><div class="card-actions"><button class="primary" onclick="openDetail('${esc(x.id)}')">Подробнее</button><button type="button">♡</button><button type="button" onclick="navigator.clipboard?.writeText('${esc(x.post_url||'')}')">↗</button><button type="button">⌖</button></div></div></article>`}
  function renderMarkers(rows){const wrap=$('#markers');wrap.innerHTML=rows.slice(0,42).map((x,i)=>{const left=7+(i*37)%88,top=16+(i*53)%70;return `<button class="pin" style="left:${left}%;top:${top}%" onclick="openDetail('${esc(x.id)}')">${state.mode==='rent'?'От ':''}${pretty(price(x.price))} $<span>${(i%19)+1}</span></button>`}).join('')}
  function buildDistricts(){const wrap=$('#districtChips');const vals=[...new Set(state.items.map(x=>x.district).filter(Boolean))].sort();wrap.innerHTML='<button class="chip active" data-value="all">Все районы</button>'+vals.map(v=>`<button class="chip" data-value="${esc(v)}">${esc(v)}</button>`).join('');wrap.querySelectorAll('button').forEach(b=>b.onclick=()=>{wrap.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filters.district=b.dataset.value})}
  function openFilters(){const s=$('#filterSheet');s.classList.add('open')}
  function closeFilters(){ $('#filterSheet').classList.remove('open') }
  function openDetail(id){const x=state.items.find(a=>String(a.id)===String(id));if(!x)return;state.detail=x;state.detailPhoto=0;updateDetail();$('#detailSheet').classList.add('open')}
  function updateDetail(){const x=state.detail;const photos=Array.isArray(x.photos)&&x.photos.length?x.photos:(x.image?[x.image]:[]);$('#detailImage').src=photos[state.detailPhoto]||'';$('#detailCount').textContent=`${state.detailPhoto+1} из ${photos.length||1}`;$('#detailPrice').textContent=`${pretty(price(x.price))} $${state.mode==='rent'?'/мес.':''}`;$('#detailFacts').innerHTML=`<div class="fact"><b>${esc(x.rooms||'—')}-комн.</b><span>Квартира</span></div><div class="fact"><b>${esc(x.area||'—')} м²</b><span>Площадь</span></div><div class="fact"><b>${esc(x.floor||'—')}</b><span>Этаж</span></div>`;$('#detailAddress').innerHTML=`<i>⌖</i><span>${esc(x.title||x.district||'Тбилиси')}</span>`;$('#detailMetro').textContent='◉ '+(x.metro||x.district||'Тбилиси');$('#detailDescription').textContent=x.description||'Актуальное объявление из Telegram-канала. Подробности и доступность уточняются у менеджера.'}
  function setMode(mode){state.mode=mode;state.items=[];state.filters={sort:'date',type:'all',rooms:'all',district:'all',min:'',max:''};$$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));load()}
  $$('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$$('.bottomnav button').forEach(b=>b.onclick=()=>{$$('.bottomnav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.view').forEach(v=>v.classList.remove('active'));$('#'+b.dataset.view).classList.add('active');if(b.dataset.view==='listView')render()});$('#mapFilter').onclick=openFilters;$('#listFilter').onclick=openFilters;$('#closeFilters').onclick=closeFilters;$('#detailBack').onclick=()=>$('#detailSheet').classList.remove('open');$('#detailNext').onclick=()=>{const p=state.detail?.photos||[];if(p.length){state.detailPhoto=(state.detailPhoto+1)%p.length;updateDetail()}};$('#applyFilters').onclick=()=>{state.filters.min=$('#minPrice').value;state.filters.max=$('#maxPrice').value;closeFilters();render()};$('#resetFilters').onclick=()=>{state.filters={sort:'date',type:'all',rooms:'all',district:'all',min:'',max:''};$('#minPrice').value='';$('#maxPrice').value='';$$('.chip').forEach((b,i)=>b.classList.toggle('active',i===0));render()};$$('[data-filter]').forEach(group=>group.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{group.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filters[group.dataset.filter]=b.dataset.value; }));load();
  </script>
</body>
</html>
